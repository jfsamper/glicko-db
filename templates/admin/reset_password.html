{% extends "base.html" %}

{% block content %}
<section class="panel">
  <div class="panel-header"><h2>{{ translations.reset_password_title }}</h2></div>
  <form method="post" class="filter-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="filter-panel">
      <div class="filter-grid">
        <div class="filter-item wide">
          <label for="new_password">{{ translations.new_password_label }}</label>
          <input id="new_password" name="new_password" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="filter-item wide">
          <label for="confirm_password">{{ translations.confirm_password_label }}</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password">
        </div>
      </div>
      <div class="filter-actions">
        <button type="submit" class="button">{{ translations.reset_password_button }}</button>
      </div>
    </div>
  </form>
</section>
{% endblock %}
