{% extends "base.html" %}

{% block content %}

<section class="panel">

  <div class="panel-actions">
    <nav aria-label="Breadcrumb" class="breadcrumb">
      <a href="{{ url_for('admin', lang=lang) }}">{{ translations.admin_heading }}</a>
      <span> &gt; </span>
      <a href="{{ url_for('admin_users', lang=lang) }}">{{ translations.user_management_heading }}</a>
      <span> &gt; </span>
      <span>{{ translations.edit_user_heading }}</span>
    </nav>
  </div>

  <div class="panel-header">
    <h2>{{ translations.edit_user_heading }}</h2>
  </div>

  <form method="post" class="filter-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="filter-panel">
      <div class="filter-header">
        <h3>{{ user.username }}</h3>
      </div>

      <div class="filter-grid">
        <div class="filter-item wide">
          <label for="username">{{ translations.username_label }}</label>
          <input id="username" name="username" type="text" value="{{ user.username }}" required>
        </div>

        <div class="filter-item wide">
          <label for="password">{{ translations.password_label }}</label>
          <input id="password" name="password" type="password" placeholder="{{ translations.password_label }}">
        </div>

        <div class="filter-item wide">
          <label for="email">{{ translations.email_label }}</label>
          <input id="email" name="email" type="email" value="{{ user.email or '' }}" autocomplete="email">
        </div>

        <div class="filter-item wide">
          <label for="role_name">{{ translations.role_label }}</label>
          <select id="role_name" name="role_name">
            {% for role in roles %}
              <option value="{{ role }}" {% if role == user.role_name %}selected{% endif %}>{{ role }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="filter-item wide">
          <label for="timezone">{{ translations.timezone_label }}</label>
          <select id="timezone" name="timezone">
            <option value="">{{ translations.timezone_default }}</option>
            {% for timezone in timezone_choices %}
              <option value="{{ timezone }}" {% if timezone == user.timezone %}selected{% endif %}>{{ timezone }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="filter-item wide">
          <label>
            <input type="checkbox" name="is_active" value="1" {% if user.is_active %}checked{% endif %}>
            {{ translations.active_label }}
          </label>
        </div>
      </div>

      <div class="filter-actions">
        <button type="submit" class="button">{{ translations.edit_user_button }}</button>
        <a href="{{ url_for('admin_users', lang=lang) }}" class="button secondary">
          {{ translations.cancel_button }}
        </a>
      </div>
    </div>
  </form>

</section>

{% endblock %}
