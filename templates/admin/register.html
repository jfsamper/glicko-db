{% extends "base.html" %}

{% block content %}
<section class="panel">
  <div class="panel-actions">
    <a href="{{ url_for('admin_login', lang=lang) }}">{{ translations.login_button }}</a>
  </div>
  <div class="panel-header">
    <h2>{{ translations.create_account_heading }}</h2>
  </div>
  <form method="post" class="filter-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="filter-panel">
      <div class="filter-grid">
        <div class="filter-item wide">
          <label for="username">{{ translations.username_label }}</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="filter-item wide">
          <label for="email">{{ translations.email_label }}</label>
          <input id="email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="filter-item wide">
          <label for="password">{{ translations.password_label }}</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="filter-item wide">
          <label for="confirm_password">{{ translations.confirm_password_label }}</label>
          <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
      </div>
      <div class="filter-actions">
        <button type="submit" class="button">{{ translations.create_account_button }}</button>
        <a href="{{ url_for('admin_login', lang=lang) }}" class="button secondary">{{ translations.cancel_button }}</a>
      </div>
    </div>
  </form>
</section>
{% endblock %}
