{% extends "base.html" %}

{% block content %}
<section class="panel">
  <div class="panel-header"><h2>{{ translations.forgot_password_title }}</h2></div>
  <form method="post" class="filter-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="filter-panel">
      <div class="filter-grid">
        <div class="filter-item wide">
          <label for="email">{{ translations.email_label }}</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
      </div>
      <div class="filter-actions">
        <button type="submit" class="button">{{ translations.send_reset_button }}</button>
        <a href="{{ url_for('admin_login', lang=lang) }}" class="button secondary">{{ translations.cancel_button }}</a>
      </div>
    </div>
  </form>
</section>
{% endblock %}
